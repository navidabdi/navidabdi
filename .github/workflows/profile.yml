name: Profile header

# Redraws the Berlin street scene from live GitHub data once a week.
#
# No secret is needed. "Include private contributions on my profile" is switched on,
# so the contribution totals are public and the built-in GITHUB_TOKEN can read them.
# Nothing here touches any organisation.

on:
  schedule:
    # Mondays, 04:17 UTC. The odd minute is deliberate: GitHub delays or drops
    # schedules that land on the hour, when everyone else's are queued.
    #
    # A weekly run still commits every week, because reading the komarev badge
    # nudges its own counter and the view figure therefore always differs. That
    # keeps the repository active, so the schedule never hits GitHub's 60-day
    # auto-disable — which is what the old `dummy commit` entries were for.
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-header
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Redraw the scene
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit only if a number actually moved
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore(profile): refresh header stats'
          git push
